<!doctype html><html><head><meta charset="utf-8"><title>FOUNDRY // Tactical FPS</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#070b10;color:#dce8f4;font:14px monospace}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 3px #000}#top{padding:18px;display:flex;justify-content:space-between;color:#8fd5ff}#bottom{position:absolute;bottom:22px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:end}.big{font-size:32px;color:#fff}.accent{color:#ffb347}.panel{background:#08131dcc;border:1px solid #34556b;padding:10px}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:'';position:absolute;background:#dff;box-shadow:0 0 5px #8ff}.cross:before{left:8px;top:0;width:2px;height:18px}.cross:after{left:0;top:8px;width:18px;height:2px}#hint{position:absolute;left:50%;top:58%;transform:translateX(-50%);color:#9ab4c7}</style></head><body><div id="hud"><div id="top"><div class="panel">FOUNDRY // TACTICAL OPERATION // LIVE</div><div class="panel">ROUND <b id="round">01</b> &nbsp; <span id="score">CT 0 : 0 T</span> &nbsp; <b id="timer">1:35</b></div></div><div class="cross"></div><div id="hint">CLICK TO DEPLOY · WASD MOVE · MOUSE AIM · LMB FIRE · R RELOAD</div><div id="bottom"><div class="panel"><div>HEALTH</div><div class="big" id="health">100</div><div>ARMOR 50</div></div><div class="panel"><div>PRIMARY // VANDAL</div><div class="big"><span id="ammo">30</span><span class="accent"> / 90</span></div><div id="status">READY</div></div></div></div><script type="module">import * as THREE from './three.module.min.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x071019);scene.fog=new THREE.Fog(0x071019,18,70);const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,100);camera.position.set(0,1.7,19);let yaw=0,pitch=0,locked=false,ammo=30,time=95,score=0;const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);const amb=new THREE.HemisphereLight(0x9bc8ff,0x17201b,1.7);scene.add(amb);const sun=new THREE.DirectionalLight(0xffd7a3,2);sun.position.set(8,18,8);scene.add(sun);function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.82,metalness:.18})}function cube(x,y,z,w,h,d,c){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));o.position.set(x,y,z);scene.add(o);return o}cube(0,-.15,0,48,.3,46,0x273943);cube(0,2,-23,48,4,1,0x304a55);cube(0,2,23,48,4,1,0x304a55);cube(-23,2,0,1,4,46,0x304a55);cube(23,2,0,1,4,46,0x304a55);cube(0,2,0,7,4,7,0x58646b);for(let x of [-12,-6,6,12])for(let z of [-8,0,8])cube(x,.7,z,2,1.4,2,0xb26e3b);for(let i=0;i<5;i++){let b=cube(-14+i*7,1,8,1.5,2,1.5,0x3b7182);b.userData.enemy=true}for(let i=0;i<7;i++){const x=-18+i*6;cube(x,3.5,4,5,.25,.25,0xc57b45)}const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR'){ammo=30;document.querySelector('#status').textContent='RELOADED'}});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock());addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;document.querySelector('#hint').style.display=locked?'none':'block'});addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.002;pitch=Math.max(-1.35,Math.min(1.35,pitch-e.movementY*.002))});addEventListener('mousedown',e=>{if(e.button===0&&locked&&ammo>0){ammo--;document.querySelector('#status').textContent='FIRING';for(const o of scene.children)if(o.userData.enemy&&Math.random()<.24){o.scale.y=.15;o.userData.enemy=false;score++;break}}});let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;time=Math.max(0,time-dt);if(time===0){time=95;score=0;document.querySelector('#round').textContent=String(+document.querySelector('#round').textContent+1).padStart(2,'0')}const speed=keys.ShiftLeft?3:6;let dx=(keys.KeyD?1:0)-(keys.KeyA?1:0),dz=(keys.KeyS?1:0)-(keys.KeyW?1:0);const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;camera.position.x+= (Math.cos(yaw)*dx+Math.sin(yaw)*dz)*speed*dt;camera.position.z+=(-Math.sin(yaw)*dx+Math.cos(yaw)*dz)*speed*dt;camera.position.x=Math.max(-21,Math.min(21,camera.position.x));camera.position.z=Math.max(-21,Math.min(21,camera.position.z));camera.rotation.set(pitch,yaw,0,'YXZ');document.querySelector('#ammo').textContent=String(ammo).padStart(2,'0');document.querySelector('#timer').textContent=Math.floor(time/60)+':'+String(Math.floor(time%60)).padStart(2,'0');document.querySelector('#score').textContent='CT '+score+' : 0 T';renderer.render(scene,camera);requestAnimationFrame(loop)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop(performance.now());</script></body></html>ა
